# ===================================================================
# CONFIGURACAO BASE - RETENTION & PERFORMANCE DASHBOARD (DATA-DRIVEN)
# Diretriz: Ambiente limpo, sem scripts de seed ou dados ficticios.
# ===================================================================

spring.application.name=retention-dashboard
server.port=8080

# Persistencia MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/retention_dashboard_db}
spring.data.mongodb.auto-index-creation=true

# Configuracao de Upload Multipart (Importacao de Boletim CSV via Spring Batch)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Spring Batch - Execucao sob demanda via Controller (nao executa automaticamente no startup)
spring.batch.job.enabled=false

# Seguranca de Respostas HTTP (Ocultar stacktrace interna em respostas de erro)
server.error.include-stacktrace=never
server.error.include-message=always

# Integracao com Motor Preditivo Python
app.predictive.python-service-url=${PYTHON_SERVICE_URL:http://localhost:8000/api/v1/predict}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500}

